[project]
name = "eventmer-backend"
version = "0.1.0"
description = "API do EVENTMER"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends() em argumentos padrão é o padrão do FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
