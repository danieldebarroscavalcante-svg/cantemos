# Ambiente de desenvolvimento local do EVENTMER.
# Uso: docker compose up -d mysql
services:
  mysql:
    image: mysql:8.0
    container_name: eventmer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eventmer
      MYSQL_USER: eventmer
      MYSQL_PASSWORD: eventmer
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
