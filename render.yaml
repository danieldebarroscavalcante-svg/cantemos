# Blueprint do Render (plano gratuito) para a API do EVENTMER.
# Render → New → Blueprint → selecione este repositório.
# Variáveis com "sync: false" são pedidas no momento da criação.
services:
  - type: web
    name: eventmer-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: ORGANIZATION_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
      # Endereço do site na Vercel (preencher depois que o site estiver no ar).
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_BACKEND
        value: gmail_api
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: CANTEMOS 2026
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
